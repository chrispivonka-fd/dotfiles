# =============================================================================
# Starship prompt — modern two-line prompt with GitHub Dark palette
# Docs: https://starship.rs/config/
# =============================================================================

palette = "github_dark"

format = """
$os $directory$git_branch$git_status$python$nodejs$rust$golang$docker_context$aws$terraform$cmd_duration$jobs$character"""

right_format = ""

# --- OS icon -----------------------------------------------------------------
[os]
disabled = false
style = "fg:fg_muted"

[os.symbols]
Macos = ""

# --- Character (prompt symbol) -----------------------------------------------
[character]
success_symbol = "[](bold blue_bright)"
error_symbol = "[](bold red)"
vimcmd_symbol = "[](bold green)"

# --- Directory ---------------------------------------------------------------
[directory]
format = "[$path]($style) "
style = "bold blue"
truncation_length = 1
truncation_symbol = "…/"
truncate_to_repo = true

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Projects" = " "

# --- Git branch --------------------------------------------------------------
[git_branch]
format = "[$symbol$branch(:$remote_branch)]($style) "
symbol = " "
style = "bold purple"
truncation_length = 25

# --- Git status --------------------------------------------------------------
[git_status]
format = '([$all_status$ahead_behind]($style) )'
style = "bold orange"
conflicted = "󰞇 ${count} "
ahead = "󰜷 ${count} "
behind = "󰜮 ${count} "
diverged = "󰹹 ${ahead_count}󰜷 ${behind_count}󰜮 "
untracked = "󰅠 ${count} "
stashed = "󰠘 ${count} "
modified = "󰏫 ${count} "
staged = "󰐖 ${count} "
renamed = "󰑕 ${count} "
deleted = "󰛌 ${count} "

# --- Languages ---------------------------------------------------------------
[python]
format = '[$symbol($version)]($style) '
symbol = " "
style = "yellow"

[nodejs]
format = '[$symbol($version)]($style) '
symbol = " "
style = "green"

[rust]
format = '[$symbol($version)]($style) '
symbol = "󱘗 "
style = "red"

[golang]
format = '[$symbol($version)]($style) '
symbol = " "
style = "cyan"

# --- Infrastructure ----------------------------------------------------------
[docker_context]
format = '[$symbol$context]($style) '
symbol = " "
only_with_files = true
style = "blue"

[aws]
format = '[$symbol$profile(\($region\))]($style) '
symbol = " "
style = "yellow"

[terraform]
format = '[$symbol$workspace]($style) '
symbol = "󱁢 "
style = "purple"

# --- Command duration --------------------------------------------------------
[cmd_duration]
min_time = 2000
format = '[$duration]($style)'
style = "dimmed yellow"
show_milliseconds = false

# --- Background jobs ----------------------------------------------------------
[jobs]
format = '[$symbol$number]($style) '
symbol = "󱕷 "
style = "cyan"
number_threshold = 1

# --- Disabled (keep prompt fast) ---------------------------------------------
[package]
disabled = true

[battery]
disabled = true

# --- GitHub Dark Palette -----------------------------------------------------
[palettes.github_dark]
fg = "#e6edf3"
fg_muted = "#8b949e"
fg_subtle = "#6e7681"
bg = "#0d1117"
bg_subtle = "#161b22"
border = "#30363d"
red = "#ff7b72"
orange = "#f0883e"
yellow = "#d29922"
green = "#3fb950"
cyan = "#39c5cf"
blue = "#58a6ff"
blue_bright = "#79c0ff"
purple = "#bc8cff"
white = "#b1bac4"
