# =============================================================================
# Starship prompt — modern two-line prompt with GitHub Dark palette
# Docs: https://starship.rs/config/
# =============================================================================

palette = "github_dark"

format = """
$os $directory$git_branch$git_status$python$nodejs$rust$golang$java$docker_context$aws$kubernetes$terraform$cmd_duration$jobs$character"""

right_format = """$cmd_duration"""

# --- Character (prompt symbol) -----------------------------------------------
[character]
success_symbol = "[󰄾](bold lavender)"
error_symbol = "[󰄾](bold red)"
vimcmd_symbol = "[󰄼](bold green)"

# --- Directory ---------------------------------------------------------------
[directory]
format = "[$path]($style) "
style = "bold blue"
truncation_length = 1
truncation_symbol = "…/"
truncate_to_repo = true

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Projects" = " "

# --- Git branch --------------------------------------------------------------
[git_branch]
format = "[$symbol$branch(:$remote_branch)]($style) "
symbol = " "
style = "bold mauve"
truncation_length = 25

# --- Git status --------------------------------------------------------------
[git_status]
format = '([$all_status$ahead_behind]($style) )'
style = "bold peach"
conflicted = "󰞇 ${count} "
ahead = "󰜷 ${count} "
behind = "󰜮 ${count} "
diverged = "󰹹 ${ahead_count}󰜷 ${behind_count}󰜮 "
untracked = "󰅠 ${count} "
stashed = "󰠘 ${count} "
modified = "󰏫 ${count} "
staged = "󰐖 ${count} "
renamed = "󰑕 ${count} "
deleted = "󰛌 ${count} "

# --- Languages ---------------------------------------------------------------
[python]
format = '[$symbol($version)]($style) '
symbol = " "
style = "yellow"

[nodejs]
format = '[$symbol($version)]($style) '
symbol = " "
style = "green"

[rust]
format = '[$symbol($version)]($style) '
symbol = "󱘗 "
style = "red"

[golang]
format = '[$symbol($version)]($style) '
symbol = " "
style = "teal"

[java]
format = '[$symbol($version)]($style) '
symbol = " "
style = "red"

# --- Infrastructure ----------------------------------------------------------
[docker_context]
format = '[$symbol$context]($style) '
symbol = " "
only_with_files = true
style = "blue"

[aws]
format = '[$symbol$profile(\($region\))]($style) '
symbol = " "
style = "yellow"

[kubernetes]
format = '[$symbol$context(\($namespace\))]($style) '
symbol = "󱃾 "
disabled = false
style = "teal"
detect_files = ["k8s"]
detect_folders = ["k8s", ".kube"]

[terraform]
format = '[$symbol$workspace]($style) '
symbol = "󱁢 "
style = "mauve"

# --- Command duration --------------------------------------------------------
[cmd_duration]
min_time = 2000
format = '[$duration]($style)'
style = "dimmed yellow"
show_milliseconds = false

# --- Background jobs ----------------------------------------------------------
[jobs]
format = '[$symbol$number]($style) '
symbol = "󱕷 "
style = "teal"
number_threshold = 1

# --- Disabled (keep prompt fast) ---------------------------------------------
[package]
disabled = true

[battery]
disabled = true

# --- GitHub Dark Palette ------------------------------------------------------
[palettes.github_dark]
rosewater = "#ffa198"
flamingo = "#ffa657"
pink = "#d2a8ff"
mauve = "#bc8cff"
red = "#ff7b72"
maroon = "#ffa198"
peach = "#ffa657"
yellow = "#d29922"
green = "#3fb950"
teal = "#76e3ea"
sky = "#79c0ff"
sapphire = "#58a6ff"
blue = "#58a6ff"
lavender = "#bc8cff"
text = "#e6edf3"
subtext1 = "#b1bac4"
subtext0 = "#8b949e"
overlay2 = "#8b949e"
overlay1 = "#6e7681"
overlay0 = "#6e7681"
surface2 = "#30363d"
surface1 = "#21262d"
surface0 = "#161b22"
base = "#0d1117"
mantle = "#010409"
crust = "#010409"
