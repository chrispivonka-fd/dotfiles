# Global fallback toolchain for the macOS work environment.
# Project-level mise.toml files and idiomatic version files take precedence.

min_version = "2026.9.12"

[settings]
experimental = true
lockfile = true
lockfile_platforms = ["macos-arm64", "macos-x64"]
minimum_release_age = "7d"
not_found_auto_install = false
idiomatic_version_file_enable_tools = [
  "dotnet",
  "go",
  "node",
  "python",
  "rust",
  "terraform",
]

[tools]
# Runtimes and package managers. The lockfile makes these global fallbacks
# reproducible; projects pin any required version in their own mise.toml.
node = "latest"
python = "latest"
dotnet = "latest"
go = "latest"
rust = { version = "latest", profile = "default" }
terraform = "latest"
bun = "latest"
pnpm = "latest"
uv = "latest"

# Portable cross-project tools distributed by their native ecosystems.
aws-cdk = "latest"
"npm:npm-check-updates" = "latest"
ruff = "latest"
snyk = "latest"
tflint = "latest"
pre-commit = "latest"
yamllint = "latest"
"pipx:sqlfluff" = "latest"
zizmor = "latest"
actionlint = "latest"

# Global .NET tools retained for AWS Lambda, EF Core, and dependency updates.
"dotnet:amazon.lambda.tools" = "latest"
"dotnet:dotnet-ef" = "latest"
"dotnet:dotnet-outdated-tool" = "latest"
