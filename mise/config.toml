# =============================================================================
# Mise — global tool versions
# Docs: https://mise.jdx.dev/configuration.html
# =============================================================================
# These are the global fallback versions used when no project-level
# .mise.toml or .tool-versions file is present.

[tools]
python = "3.13"
node = "lts"
go = "latest"

# Package managers/runtimes for the above — mise-managed so there's one
# consistent, checksum-verified path instead of each having its own
# official curl-installer script per OS
pnpm = "latest"
bun = "latest"
uv = "latest"

# CLI tools — mise's aqua backend installs these with checksum verification,
# one consistent path on both macOS and Linux (replaces per-OS package lists
# and hand-rolled GitHub-release curl installers)
delta = "latest"
lazygit = "latest"
lazydocker = "latest"
yq = "latest"
gitleaks = "latest"
tree-sitter = "latest"
yazi = "latest"
bottom = "latest"
atuin = "latest"
vivid = "latest"

[settings]
experimental = true
plugin_autoupdate_last_check_duration = "7d"
always_keep_download = false
always_keep_install = false
# Activate tools automatically when entering a directory
activate_aggressive = false
# Speed: don't re-check for new versions on every shell init
not_found_auto_install = false
